name: Republish upstream APKs and honk cores

# One release per architecture, same shape as VIKINGYFY/OpenWRT-CI:
# <line>-VIKINGYFY-owrt-<yy.mm.dd-HH.MM.SS>
# native-ui honk and vmlinux-btf-builtin are downloaded. clash and bare are built.
# doona is the pinned panel apk. zashboard is whatever GitHub marks latest.
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'Stable SDK release (example: 25.12.6)'
        type: string
        required: true
        default: '25.12.6'
      doona_tag:
        description: 'doona release tag that supplies the panel apk'
        type: string
        required: true
        default: 'v0.1.0-rc.6'

permissions:
  contents: write

concurrency:
  group: republish-upstream-apks
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cores:
    name: ${{ matrix.line }} clash, bare and release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            target: mediatek/filogic
            line: A53
          - arch: aarch64_cortex-a72
            target: bcm27xx/bcm2711
            line: A72
          - arch: aarch64_cortex-a76
            target: bcm27xx/bcm2712
            line: A76
          - arch: aarch64_generic
            target: armsr/armv8
            line: ARM64
          - arch: x86_64
            target: x86/64
            line: X86_64
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      OPENWRT_ARCH: ${{ matrix.arch }}
      SDK_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pins
        run: |
          set -euo pipefail
          source custom/honk-score/pins.env
          echo "HONK_FEED_COMMIT=$HONK_FEED_COMMIT" >> "$GITHUB_ENV"
          echo "HONK_COMMIT=$HONK_COMMIT" >> "$GITHUB_ENV"
          echo "HONK_FEED_DIR=$GITHUB_WORKSPACE/_honk-feed" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: daeuniverse/openwrt-packages
          ref: ${{ env.HONK_FEED_COMMIT }}
          path: _honk-feed
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: daeuniverse/honk
          ref: ${{ env.HONK_COMMIT }}
          path: _honk-feed/honk/src
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev \
            pkg-config cmake libclang-dev zstd build-essential bzip2 perl python3 \
            rsync unzip git ca-certificates file gawk gettext libncurses-dev
      - name: Install Rust and bpf-linker
        run: |
          set -euo pipefail
          core="$GITHUB_WORKSPACE/_honk-feed/honk/src"
          stable=$(python3 -c 'import tomllib,sys; print(tomllib.load(open(sys.argv[1],"rb"))["toolchain"]["channel"])' "$core/rust-toolchain.toml")
          nightly=$(python3 -c 'import tomllib,sys; print(tomllib.load(open(sys.argv[1],"rb"))["toolchain"]["channel"])' "$core/crates/honk-ebpf/rust-toolchain.toml")
          rustup toolchain install "$stable" --profile minimal --target aarch64-unknown-linux-musl --target x86_64-unknown-linux-musl
          rustup toolchain install "$nightly" --profile minimal --component rust-src --component llvm-tools
          source "$core/.github/ci/pins.env"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$HOME/.cargo/bin"
          bpf-linker --version
      - name: Download the SDK
        run: bash custom/honk-score/prepare-sdk-target.sh
      - name: Prepare the honk package
        run: |
          set -euo pipefail
          source custom/honk-score/pins.env
          export HONK_FEED_COMMIT HONK_COMMIT HONK_GIT_TAG HONK_VERSION
          cd "$SDK_DIR"
          printf 'src-link honk %s\n' "$HONK_FEED_DIR" > feeds.conf
          ./scripts/feeds update honk
          ./scripts/feeds install -p honk honk
          printf '\nCONFIG_PACKAGE_honk=m\n' >> .config
          make defconfig
          grep -q "^CONFIG_TARGET_ARCH_PACKAGES=\"$OPENWRT_ARCH\"$" .config
      - name: Build clash and bare cores
        run: |
          set -euo pipefail
          for variant in clash bare; do
            HONK_VARIANT="$variant" bash custom/honk-score/build-honk-variant.sh
          done
      - name: Collect this architecture and the latest zashboard
        env:
          DOONA_TAG: ${{ inputs.doona_tag }}
          LINE: ${{ matrix.line }}
        run: |
          set -euo pipefail
          series=${OPENWRT_VERSION%.*}
          mkdir -p upload
          find dist/cores -type f -name '*.apk' -exec cp -t upload {} +
          base="https://openwrt.daeuniverse.org/files/${series}/packages/${OPENWRT_ARCH}"
          page=$(curl -fsSL --retry 3 "$base/")
          honk=$(printf '%s\n' "$page" | grep -oE 'honk-[^" ]+\.apk' | head -n 1)
          btf=$(printf '%s\n' "$page" | grep -oE 'vmlinux-btf-builtin-[^" ]+\.apk' | head -n 1)
          [[ -n "$honk" && -n "$btf" ]] || { echo "::error::Missing honk or vmlinux-btf-builtin"; exit 1; }
          curl -fL --retry 3 -o "upload/${OPENWRT_ARCH}-honk-native-ui-$honk" "$base/$honk"
          curl -fL --retry 3 -o "upload/${OPENWRT_ARCH}-$btf" "$base/$btf"
          tmp=$(mktemp -d)
          gh release download "$DOONA_TAG" --repo Zakkaus/doona --dir "$tmp" --pattern 'doona-*.apk'
          mapfile -t panel < <(find "$tmp" -type f -name 'doona-*_*-r*.apk' ! -name 'doona-fonts-*' ! -name 'doona-precompressed-*')
          [[ ${#panel[@]} == 1 ]] || { echo "::error::Expected one doona panel apk, found ${#panel[@]}"; exit 1; }
          cp "${panel[0]}" upload/
          ztag=$(gh release view --repo Zephyruso/zashboard --json tagName --jq .tagName)
          gh release download --repo Zephyruso/zashboard --pattern dist.zip --dir "$tmp" --clobber
          cp "$tmp/dist.zip" "upload/zashboard-${ztag}-dist.zip"
          echo "ZASHBOARD_TAG=$ztag" >> "$GITHUB_ENV"
          (cd upload && sha256sum ./* > SHA256SUMS)
          stamp=$(TZ=UTC-8 date +%y.%m.%d-%H.%M.%S)
          echo "REL_TAG=${LINE}-HONK-VIKINGYFY-owrt-$stamp" >> "$GITHUB_ENV"
          ls -l upload
      - name: Publish this architecture
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_TAG }}
          files: upload/*
          body: |
            ${{ matrix.arch }} only. One release per architecture, same tag shape as VIKINGYFY/OpenWRT-CI.

            - honk-native-ui: downloaded. Clash API, native API, embedded doona.
            - honk-clash and honk-bare: built here. The internal package name is still honk, so do not install them on top of each other.
            - vmlinux-btf-builtin: downloaded placeholder.
            - doona panel: ${{ inputs.doona_tag }}.
            - zashboard: latest release (${{ env.ZASHBOARD_TAG }}), dist.zip. It is a web bundle, not an architecture-specific apk.

            SDK: ${{ inputs.openwrt_version }}, target ${{ matrix.target }}.
            Source: ${{ github.sha }}.
