name: Build A53 APKs with honk Score

# Independent of the upstream auto-bump/release workflows. Syncing upstream
# package files triggers this build, but this workflow never rewrites main.
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'Stable SDK release, 25.12 or newer (example: 25.12.6)'
        type: string
        required: true
        default: '25.12.6'
  push:
    branches: [main]
    paths:
      - 'custom/honk-score/**'
      - '.github/workflows/build-honk-score-a53.yml'
      - 'luci-app-daede/**'
      - 'dae/**'
      - 'daed/**'
      - 'ci/pins.env'

permissions:
  contents: read

concurrency:
  group: honk-score-a53-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.inputs.outputs.sha }}
      version: ${{ steps.inputs.outputs.version }}
      series: ${{ steps.inputs.outputs.series }}
      honk_feed: ${{ steps.inputs.outputs.honk_feed }}
      honk_core: ${{ steps.inputs.outputs.honk_core }}
      sdk_action: ${{ steps.inputs.outputs.sdk_action }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Freeze source inputs
        id: inputs
        env:
          REQUESTED_VERSION: ${{ inputs.openwrt_version }}
        run: |
          set -euo pipefail
          source custom/honk-score/pins.env
          version=${REQUESTED_VERSION:-$DEFAULT_OPENWRT_VERSION}
          [[ "$version" =~ ^([0-9]{2})\.([0-9]{2})\.([0-9]+)$ ]] || {
            echo '::error::Use a stable release such as 25.12.6'; exit 1;
          }
          (( 10#${BASH_REMATCH[1]} * 100 + 10#${BASH_REMATCH[2]} >= 2512 )) || {
            echo '::error::OpenWrt 24.10/IPK is not supported by this workflow'; exit 1;
          }
          {
            echo "sha=$GITHUB_SHA"
            echo "version=$version"
            echo "series=${version%.*}"
            echo "honk_feed=$HONK_FEED_COMMIT"
            echo "honk_core=$HONK_COMMIT"
            echo "sdk_action=$SDK_ACTION_COMMIT"
          } >> "$GITHUB_OUTPUT"
      - name: Check and apply the source overlay
        run: |
          bash custom/honk-score/apply.sh "$GITHUB_WORKSPACE"
          git diff --check
          node <<'JS'
          const fs = require('fs'), path = require('path');
          const root = 'luci-app-daede/htdocs/luci-static/resources/view/daede';
          for (const name of fs.readdirSync(root).filter(n => n.endsWith('.js')))
            new Function(fs.readFileSync(path.join(root, name), 'utf8'));
          JSON.parse(fs.readFileSync('luci-app-daede/root/usr/share/rpcd/acl.d/luci-app-daede.json'));
          JS

  dae-daed-luci:
    name: dae + daed + patched LuCI (A53)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: kenzok8/gh-action-sdk
          ref: ${{ needs.prepare.outputs.sdk_action }}
          path: .github/actions/honk-score-sdk
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: daeuniverse/openwrt-packages
          ref: ${{ needs.prepare.outputs.honk_feed }}
          path: _honk-feed
          persist-credentials: false
      - name: Prepare patched packages
        run: |
          set -euo pipefail
          bash custom/honk-score/apply.sh "$GITHUB_WORKSPACE"
          # Keep the honk recipe available to the SDK. This job builds
          # only dae, daed and LuCI; the source-based honk build has its own job.
          cp -a _honk-feed/honk honk
          mv _honk-feed "$RUNNER_TEMP/honk-feed-metadata"
          git -C .github/actions/honk-score-sdk apply "$GITHUB_WORKSPACE/.github/patches/gh-action-sdk-pahole.patch"
          git -C .github/actions/honk-score-sdk apply "$GITHUB_WORKSPACE/custom/honk-score/sdk-no-btf-build.patch"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the original WebUI with honk Native API support
        run: bash custom/honk-score/build-webui.sh "$GITHUB_WORKSPACE"
      - name: Free runner disk for Go builds
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Build three APKs with the upstream SDK action
        uses: ./.github/actions/honk-score-sdk
        env:
          CONTAINER: immortalwrt/sdk
          ARCH: aarch64_cortex-a53-openwrt-${{ needs.prepare.outputs.series }}
          FEEDNAME: daede
          PACKAGES: dae daed luci-app-daede
          EXTRA_FEEDS: src-git|wall|https://github.com/kenzok8/wall
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true
          IGNORE_ERRORS: false
          INDEX: 0
          KEY_BUILD: ''
          PRIVATE_KEY: ''
          GOLANG_REPO: https://github.com/kenzok8/golang
          GOLANG_BRANCH: '1.27'
      - name: Refuse a build that logged package errors
        # The SDK action can exit 0 even when a package failed to build; the
        # real reason lands in logs/package/error.txt. Fail here, on the real
        # message, instead of letting the collector report a missing APK.
        run: |
          set -euo pipefail
          if [ -s logs/package/error.txt ]; then
            echo '::error::the SDK build reported a package failure; see the lines below'
            cat logs/package/error.txt
            exit 1
          fi
      - name: Require and collect the three requested APKs
        env:
          SDK_SERIES: ${{ needs.prepare.outputs.series }}
        run: |
          set -euo pipefail
          mkdir -p dist/daede
          for package in dae daed luci-app-daede; do
            mapfile -t files < <(find bin/packages/aarch64_cortex-a53/daede -maxdepth 1 -type f -name "$package-*.apk")
            if [[ ${#files[@]} != 1 ]]; then
              echo "::error::Expected one $package APK, found ${#files[@]}"
              compile_log="logs/package/feeds/daede/$package/compile.txt"
              if [ -f "$compile_log" ]; then tail -n 20 "$compile_log"; fi
              exit 1
            fi
            cp "${files[0]}" dist/daede/
          done
          {
            echo "fork_sha=$GITHUB_SHA"
            echo "sdk_container=immortalwrt/sdk:aarch64_cortex-a53-openwrt-$SDK_SERIES"
            cat ci/pins.env
            cat custom/honk-score/pins.env
          } > dist/daede/build-daede.txt
      - uses: actions/upload-artifact@v7
        with:
          name: honk-score-a53-daede
          path: dist/daede/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-honk-score-a53-daede
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  honk:
    name: honk core from source (A53)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENWRT_VERSION: ${{ needs.prepare.outputs.version }}
      HONK_FEED_COMMIT: ${{ needs.prepare.outputs.honk_feed }}
      HONK_COMMIT: ${{ needs.prepare.outputs.honk_core }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: daeuniverse/openwrt-packages
          ref: ${{ needs.prepare.outputs.honk_feed }}
          path: _honk-feed
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: daeuniverse/honk
          ref: ${{ needs.prepare.outputs.honk_core }}
          path: _honk-feed/honk/src
          persist-credentials: false
      - name: Install source build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev \
            pkg-config cmake libclang-dev zstd build-essential bzip2 perl python3 \
            rsync unzip git ca-certificates file gawk gettext libncurses-dev
      - name: Install Rust and bpf-linker from honk's pins
        run: |
          set -euo pipefail
          core="$GITHUB_WORKSPACE/_honk-feed/honk/src"
          stable=$(python3 -c 'import tomllib,sys; print(tomllib.load(open(sys.argv[1],"rb"))["toolchain"]["channel"])' "$core/rust-toolchain.toml")
          nightly=$(python3 -c 'import tomllib,sys; print(tomllib.load(open(sys.argv[1],"rb"))["toolchain"]["channel"])' "$core/crates/honk-ebpf/rust-toolchain.toml")
          rustup toolchain install "$stable" --profile minimal --target aarch64-unknown-linux-musl
          rustup toolchain install "$nightly" --profile minimal --component rust-src --component llvm-tools
          source "$core/.github/ci/pins.env"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$HOME/.cargo/bin"
          bpf-linker --version
          echo "HONK_FEED_DIR=$GITHUB_WORKSPACE/_honk-feed" >> "$GITHUB_ENV"
      - name: Download and verify the A53 SDK
        run: bash custom/honk-score/prepare-sdk.sh
      - name: Build the honk APK
        run: |
          set -euo pipefail
          bash custom/honk-score/build-honk.sh 2>&1 | tee "$RUNNER_TEMP/honk-build.log"
      - uses: actions/upload-artifact@v7
        with:
          name: honk-score-a53-honk
          path: dist/honk/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve honk build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-honk-score-a53-honk
          path: ${{ runner.temp }}/honk-build.log
          if-no-files-found: ignore
          retention-days: 14

  bundle:
    name: Verify and bundle all four APKs
    needs: [prepare, dae-daed-luci, honk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: honk-score-a53-*
          path: dist
          merge-multiple: true
      - name: Verify the complete package set
        run: |
          set -euo pipefail
          cd dist
          for package in dae daed honk luci-app-daede; do
            mapfile -t files < <(find . -maxdepth 1 -type f -name "$package-*.apk")
            [[ ${#files[@]} == 1 ]] || { echo "::error::Missing or duplicate $package APK"; exit 1; }
          done
          sha256sum ./*.apk > SHA256SUMS
          {
            echo '## A53 APKs ready'
            echo 'Packages: dae, daed, honk, luci-app-daede (Score overlay).'
            echo 'Architecture: aarch64_cortex-a53; LuCI is noarch.'
            echo 'SDK input: ${{ needs.prepare.outputs.version }} (dae/daed/LuCI use the corresponding ImmortalWrt SDK series).'
            echo 'Source: `${{ needs.prepare.outputs.sha }}`'
            echo 'Download the combined APK artifact below. No release was published.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: apks-openwrt-${{ needs.prepare.outputs.version }}-aarch64_cortex-a53-honk-score
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
